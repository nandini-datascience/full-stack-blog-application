<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - My Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            My Blog
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>

    </nav>


    <!-- Register Form -->

    <div class="form-container">

        <h1>Create Account</h1>

        <form id="registerForm">

            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>

            </div>


            <!-- Register Button -->

            <button
                type="submit"
                class="btn register-btn">

                Register

            </button>

        </form>


        <!-- Login Link -->

        <p class="form-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>

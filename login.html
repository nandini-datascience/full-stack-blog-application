<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - My Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            My Blog
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- Login Form -->

    <div class="form-container">

        <h1>Welcome Back</h1>

        <form id="loginForm">

            <!-- Email -->

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="btn register-btn">

                Login

            </button>

        </form>


        <!-- Register Link -->

        <p class="form-footer">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
